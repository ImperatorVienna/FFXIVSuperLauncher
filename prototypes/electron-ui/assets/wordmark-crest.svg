<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 100" fill="none">
  <!-- Original ornament: paired swords behind a shield bearing a faceted crystal. -->
  <defs>
    <linearGradient id="steel" x1="39" y1="4" x2="57" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff9ea"/>
      <stop offset=".4" stop-color="#cbd2d3"/>
      <stop offset=".72" stop-color="#8b9295"/>
      <stop offset="1" stop-color="#e8dfcc"/>
    </linearGradient>
    <linearGradient id="rim" x1="26" y1="30" x2="67" y2="87" gradientUnits="userSpaceOnUse">
