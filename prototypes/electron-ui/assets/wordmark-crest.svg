      <path d="M45.5 61h5v20h-5Z" fill="#283439" stroke="#b9c0bc" stroke-width="1"/>
      <path d="m46 64 4 2m-4 3 4 2m-4 3 4 2" stroke="#b3b7ae" stroke-width="1.2"/>
      <path d="m48 80 4 5-4 5-4-5Z" fill="url(#steel)" stroke="#d4d4c6" stroke-width="1"/>
      <path d="m48 83 1.5 2-1.5 2-1.5-2Z" fill="#324953"/>
