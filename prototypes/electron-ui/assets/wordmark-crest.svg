  <path d="M48 36c-5 3-11 4-17 5l2 18c1 9 7 18 15 24 8-6 14-15 15-24l2-18c-6-1-12-2-17-5Z" stroke="#ddd6bd" stroke-opacity=".5" stroke-width=".8"/>
