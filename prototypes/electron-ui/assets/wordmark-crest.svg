      <stop offset=".5" stop-color="#172329"/>
      <stop offset="1" stop-color="#111a1f"/>
    </linearGradient>
    <linearGradient id="crystal" x1="41" y1="40" x2="53" y2="73" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5fbf7"/>
      <stop offset=".4" stop-color="#b4d1d9"/>
      <stop offset="1" stop-color="#617f92"/>
    </linearGradient>
    <g id="sword" stroke-linejoin="round">
      <path d="M48 2 52 15 51 57 45 57 44 15Z" fill="url(#steel)" stroke="#d1d6d1" stroke-width="1"/>
      <path d="M48 5v51h-2l-1-40Z" fill="#f7f2df" fill-opacity=".7"/>
