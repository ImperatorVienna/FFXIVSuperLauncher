name: Super Linux preview
on:
  push:
    paths: ['src/**', 'scripts/**', 'compliance/**', 'packaging/**', 'SOURCES.txt', 'LICENSE', 'LINUX.en.md', 'LINUX.zh-CN.md', 'LINUX.zh-TW.md', '.github/workflows/linux.yml']
  pull_request:
    paths: ['src/**', 'scripts/**', 'compliance/**', 'packaging/**', 'SOURCES.txt', 'LICENSE', 'LINUX.en.md', 'LINUX.zh-CN.md', 'LINUX.zh-TW.md', '.github/workflows/linux.yml']
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python3 scripts/check-compliance-materials.py
      - run: dotnet test src/XIVLauncher.Linux.Tests/XIVLauncher.Linux.Tests.csproj -c Release -m:1 --filter "Category!=Network"
      - run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xivlauncher-super
          path: |
            artifacts/linux/*.tar.gz
            artifacts/linux/SHA256SUMS
            artifacts/linux/SOURCE-DELIVERY.json
